<body class="bg-parchment min-h-screen text-ink antialiased flex flex-col items-center pt-24 px-4 font-body-default selection:bg-rule">
<!-- Main Login Card Container -->
<main class="w-full max-w-[400px]">
<div class="bg-paper border border-rule rounded-xl p-8">
<!-- 1. Wordmark & 2. Subtitle -->
<header class="text-center">
<h1 class="font-headline-h2 text-[20px] font-semibold text-ink leading-tight">
          Thư viện nội bộ
        </h1>
<p class="text-[13px] text-ink-muted mt-1 leading-normal font-normal">
          Quản lý mượn trả
        </p>
</header>
<!-- 3. Minimal Rule Divider -->
<div class="w-12 h-px bg-rule mx-auto my-4" role="separator"></div>
<!-- 4. Section Title -->
<h2 class="font-headline-h1-mobile text-[22px] font-semibold text-ink text-center mt-6 mb-6 leading-tight">
        Đăng nhập
      </h2>
<!-- 5. Login Form -->
<form action="#" class="space-y-4" method="POST" onsubmit="event.preventDefault();">
<!-- Username Field -->
<div>
<label class="block text-label-field font-medium text-ink mb-1.5" for="username">
            Tên đăng nhập *
          </label>
<input autocomplete="username" class="w-full h-10 px-3 py-2 bg-paper border border-rule-strong rounded-lg text-ink placeholder:text-ink-faint text-body-default focus:outline-none focus:border-sidebar-navy focus:ring-1 focus:ring-sidebar-navy transition-colors" id="username" name="username" placeholder="Nhập tên đăng nhập" type="text" value="">
</div>
<!-- Password Field -->
<div>
<label class="block text-label-field font-medium text-ink mb-1.5" for="password">
            Mật khẩu *
          </label>
<div class="relative flex items-center">
<input autocomplete="current-password" class="w-full h-10 pl-3 pr-10 py-2 bg-paper border border-rule-strong rounded-lg text-ink placeholder:text-ink-faint text-body-default focus:outline-none focus:border-sidebar-navy focus:ring-1 focus:ring-sidebar-navy transition-colors" id="password" name="password" placeholder="Nhập mật khẩu" type="password" value="">
<button aria-label="Hiện mật khẩu" class="absolute right-0 top-0 bottom-0 px-3 flex items-center justify-center text-ink-muted hover:text-ink transition-colors cursor-pointer" id="togglePassword" type="button">
<span class="material-symbols-outlined text-[20px] select-none" id="eyeIcon">visibility</span>
</button>
</div>
</div>
<!-- Submit Button -->
<button class="w-full h-10 mt-6 px-4 bg-primary-container text-on-primary font-label-button rounded-lg hover:opacity-90 active:scale-[0.99] transition-all flex items-center justify-center cursor-pointer" type="submit">
          Đăng nhập
        </button>
</form>
</div>
<!-- 6. Small System Footer -->
<footer class="mt-6 text-center">
<p class="text-[12px] font-mono-code text-ink-muted tracking-wide">
        Hệ thống thư viện nội bộ · v1.1
      </p>
</footer>
</main>
<!-- Interactive script for password toggle -->
<script>
    const toggleBtn = document.getElementById('togglePassword');
    const pwdInput = document.getElementById('password');
    const eyeIcon = document.getElementById('eyeIcon');

    if (toggleBtn && pwdInput && eyeIcon) {
      toggleBtn.addEventListener('click', () => {
        const isPassword = pwdInput.getAttribute('type') === 'password';
        pwdInput.setAttribute('type', isPassword ? 'text' : 'password');
        eyeIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
        toggleBtn.setAttribute('aria-label', isPassword ? 'Ẩn mật khẩu' : 'Hiện mật khẩu');
      });
    }
  </script>
