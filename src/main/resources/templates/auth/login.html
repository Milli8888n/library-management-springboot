<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập — Thư viện nội bộ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&amp;display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            parchment: '#F4F1E8',
            paper: '#FCFBF7',
            linen: '#EBE6D8',
            rule: '#D8D2C2',
            'rule-strong': '#A89F8A',
            ink: '#1B2230',
            'ink-muted': '#555C6B',
            'ink-faint': '#8A8F9C',
            'sidebar-navy': '#17233A',
            brass: '#C9A24A',
            'oxblood-text': '#9B2C2C',
            'oxblood-bg': '#F5DEDC',
            'oxblood-border': '#E2B4B0',
            'moss-text': '#2F6B4F',
            'moss-bg': '#E3EFE7',
            'moss-border': '#B7D3C1',
            'primary-container': '#1F4E8C',
            primary: '#00376F',
            'on-primary': '#ffffff',
            'slate-bg': '#E9E6DC',
            'slate-border': '#CFC9B8',
          },
          fontFamily: {
            'headline-h2': ['"Source Serif 4"', 'serif'],
            'headline-h1-mobile': ['"Source Serif 4"', 'serif'],
            'body-default': ['IBM Plex Sans', 'sans-serif'],
            'label-field': ['IBM Plex Sans', 'sans-serif'],
            'label-button': ['IBM Plex Sans', 'sans-serif'],
            'mono-code': ['IBM Plex Mono', 'monospace'],
          },
          fontSize: {
            'headline-h2': ['20px', { lineHeight: '28px', fontWeight: '600' }],
            'headline-h1-mobile': ['24px', { lineHeight: '32px', fontWeight: '600' }],
            'body-default': ['14px', { lineHeight: '22px', fontWeight: '400' }],
            'label-field': ['13px', { lineHeight: '18px', fontWeight: '500' }],
            'label-button': ['14px', { lineHeight: '20px', fontWeight: '500' }],
            'mono-code': ['13px', { lineHeight: '20px', fontWeight: '400' }],
          }
        }
      }
    }
  </script>
</head>
<body class="bg-parchment min-h-screen text-ink antialiased flex flex-col items-center pt-24 px-4 font-body-default selection:bg-rule">

  <!-- Main Login Card Container -->
  <main class="w-full max-w-[400px]">
    <div class="bg-paper border border-rule rounded-xl p-8">

      <!-- 1. Wordmark & 2. Subtitle -->
      <header class="text-center">
        <h1 class="font-headline-h2 text-[20px] font-semibold text-ink leading-tight">
          Thư viện nội bộ
        </h1>
        <p class="text-[13px] text-ink-muted mt-1 leading-normal font-normal">
          Quản lý mượn trả
        </p>
      </header>

      <!-- 3. Minimal Rule Divider -->
      <div class="w-12 h-px bg-rule mx-auto my-4" role="separator"></div>

      <!-- 4. Section Title -->
      <h2 class="font-headline-h1-mobile text-[22px] font-semibold text-ink text-center mt-6 mb-6 leading-tight">
        Đăng nhập
      </h2>

      <!-- Flash: Error -->
      <div th:if="${param.error}"
           class="mb-4 p-3 bg-oxblood-bg border border-oxblood-border rounded text-oxblood-text text-[13px] leading-snug flex items-start gap-2">
        <span class="material-symbols-outlined text-[16px] mt-0.5 shrink-0">warning</span>
        Tên đăng nhập hoặc mật khẩu không đúng. Vui lòng thử lại.
      </div>

      <!-- Flash: Session expired -->
      <div th:if="${param.expired}"
           class="mb-4 p-3 bg-linen border border-rule rounded text-ink-muted text-[13px] leading-snug">
        Phiên đăng nhập đã hết hạn. Vui lòng đăng nhập lại.
      </div>

      <!-- Flash: Logout success -->
      <div th:if="${param.logout}"
           class="mb-4 p-3 bg-moss-bg border border-moss-border rounded text-moss-text text-[13px] leading-snug">
        Bạn đã đăng xuất thành công.
      </div>

      <!-- 5. Login Form -->
      <form th:action="@{/login}" method="post" id="loginForm" class="space-y-4">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <!-- Username Field -->
        <div>
          <label for="username" class="block text-label-field font-medium text-ink mb-1.5">
            Tên đăng nhập <span class="text-oxblood-text">*</span>
          </label>
          <input
            type="text"
            id="username"
            name="username"
            autocomplete="username"
            placeholder="Nhập tên đăng nhập"
            class="w-full h-10 px-3 py-2 bg-paper border border-rule-strong rounded-lg text-ink placeholder:text-ink-faint text-body-default focus:outline-none focus:border-sidebar-navy focus:ring-1 focus:ring-sidebar-navy transition-colors"
            required
            autofocus
          >
        </div>

        <!-- Password Field -->
        <div>
          <label for="password" class="block text-label-field font-medium text-ink mb-1.5">
            Mật khẩu <span class="text-oxblood-text">*</span>
          </label>
          <div class="relative flex items-center">
            <input
              type="password"
              id="password"
              name="password"
              autocomplete="current-password"
              placeholder="Nhập mật khẩu"
              class="w-full h-10 pl-3 pr-10 py-2 bg-paper border border-rule-strong rounded-lg text-ink placeholder:text-ink-faint text-body-default focus:outline-none focus:border-sidebar-navy focus:ring-1 focus:ring-sidebar-navy transition-colors"
              required
            >
            <button
              type="button"
              id="togglePassword"
              aria-label="Hiện mật khẩu"
              class="absolute right-0 top-0 bottom-0 px-3 flex items-center justify-center text-ink-muted hover:text-ink transition-colors cursor-pointer focus:outline-none"
            >
              <span class="material-symbols-outlined text-[20px] select-none" id="eyeIcon">visibility</span>
            </button>
          </div>
        </div>

        <!-- Submit Button -->
        <button
          type="submit"
          id="loginBtn"
          class="w-full h-10 mt-6 px-4 bg-primary-container text-on-primary font-label-button rounded-lg hover:opacity-90 active:scale-[0.99] transition-all flex items-center justify-center cursor-pointer"
        >
          Đăng nhập
        </button>

      </form>

    </div>

    <!-- 6. Small System Footer -->
    <footer class="mt-6 text-center">
      <p class="text-[12px] font-mono-code text-ink-muted tracking-wide">
        Hệ thống thư viện nội bộ · v1.1
      </p>
    </footer>

  </main>

  <script>
    const toggleBtn = document.getElementById('togglePassword');
    const pwdInput = document.getElementById('password');
    const eyeIcon = document.getElementById('eyeIcon');

    if (toggleBtn && pwdInput && eyeIcon) {
      toggleBtn.addEventListener('click', () => {
        const isPassword = pwdInput.getAttribute('type') === 'password';
        pwdInput.setAttribute('type', isPassword ? 'text' : 'password');
        eyeIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
        toggleBtn.setAttribute('aria-label', isPassword ? 'Ẩn mật khẩu' : 'Hiện mật khẩu');
      });
    }
  </script>
</body>
</html>
