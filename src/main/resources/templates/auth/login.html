<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập — Thư viện nội bộ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            parchment: '#F4F1E8',
            paper: '#FCFBF7',
            linen: '#EBE6D8',
            rule: '#D8D2C2',
            'rule-strong': '#A89F8A',
            ink: '#1B2230',
            'ink-muted': '#555C6B',
            'ink-faint': '#8A8F9C',
            'sidebar-navy': '#17233A',
            'ink-blue': '#1F4E8C',
            'ink-blue-hover': '#183F73',
            brass: '#C9A24A',
            'oxblood-text': '#9B2C2C',
            'oxblood-bg': '#F5DEDC',
            'oxblood-border': '#E2B4B0',
            'moss-text': '#2F6B4F',
            'moss-bg': '#E3EFE7',
            'moss-border': '#B7D3C1',
            'primary-container': '#1F4E8C',
            primary: '#00376F',
            'on-primary': '#ffffff',
          },
          fontFamily: {
            serif: ['"Source Serif 4"', 'Georgia', 'serif'],
            sans: ['"IBM Plex Sans"', 'system-ui', 'sans-serif'],
            mono: ['"IBM Plex Mono"', 'monospace'],
          }
        }
      }
    }
  </script>
</head>
<body class="bg-parchment text-ink font-sans min-h-screen flex flex-col items-center pt-24 pb-12 px-4 selection:bg-linen selection:text-ink">

  <main class="w-full max-w-[400px]">

    <!-- Paper Panel -->
    <div class="bg-paper border border-rule rounded-[8px] p-8">

      <!-- Brand & Header -->
      <header class="mb-6 text-center">
        <h1 class="font-serif text-[20px] font-semibold text-ink tracking-tight">Thư viện nội bộ</h1>
        <p class="text-[13px] text-ink-muted mt-0.5 font-normal">Quản lý mượn trả</p>
        <div class="w-12 h-px bg-rule mx-auto my-4"></div>
        <h2 class="font-serif text-[22px] font-semibold text-ink">Đăng nhập</h2>
      </header>

      <!-- Flash: Error -->
      <div th:if="${param.error}"
           class="mb-4 p-3 bg-oxblood-bg border border-oxblood-border rounded-[4px] text-oxblood-text text-[13px] leading-snug flex items-start gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mt-0.5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M12 9v4m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>
        </svg>
        Tên đăng nhập hoặc mật khẩu không đúng. Vui lòng thử lại.
      </div>

      <!-- Flash: Session expired -->
      <div th:if="${param.expired}"
           class="mb-4 p-3 bg-linen border border-rule rounded-[4px] text-ink-muted text-[13px] leading-snug">
        Phiên đăng nhập đã hết hạn. Vui lòng đăng nhập lại.
      </div>

      <!-- Flash: Logout success -->
      <div th:if="${param.logout}"
           class="mb-4 p-3 bg-moss-bg border border-moss-border rounded-[4px] text-moss-text text-[13px] leading-snug">
        Bạn đã đăng xuất thành công.
      </div>

      <!-- Login Form -->
      <form th:action="@{/login}" method="post" id="loginForm" class="space-y-4">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <!-- Username Field -->
        <div>
          <label for="username" class="block text-[13px] font-medium text-ink mb-1.5">
            Tên đăng nhập <span class="text-oxblood-text">*</span>
          </label>
          <input
            type="text"
            id="username"
            name="username"
            autocomplete="username"
            placeholder="Nhập tên đăng nhập"
            th:class="${param.error} ? 'w-full px-3.5 py-2 text-[14px] bg-paper border border-oxblood-text rounded-[4px] text-ink placeholder-ink-faint focus:outline-none focus:border-ink-blue focus:ring-1 focus:ring-ink-blue transition-colors' : 'w-full px-3.5 py-2 text-[14px] bg-paper border border-rule-strong rounded-[4px] text-ink placeholder-ink-faint focus:outline-none focus:border-ink-blue focus:ring-1 focus:ring-ink-blue transition-colors'"
            required
            autofocus
          >
        </div>

        <!-- Password Field -->
        <div>
          <label for="password" class="block text-[13px] font-medium text-ink mb-1.5">
            Mật khẩu <span class="text-oxblood-text">*</span>
          </label>
          <div class="relative">
            <input
              type="password"
              id="password"
              name="password"
              autocomplete="current-password"
              placeholder="Nhập mật khẩu"
              th:class="${param.error} ? 'w-full pl-3.5 pr-10 py-2 text-[14px] bg-paper border border-oxblood-text rounded-[4px] text-ink placeholder-ink-faint focus:outline-none focus:border-ink-blue focus:ring-1 focus:ring-ink-blue transition-colors' : 'w-full pl-3.5 pr-10 py-2 text-[14px] bg-paper border border-rule-strong rounded-[4px] text-ink placeholder-ink-faint focus:outline-none focus:border-ink-blue focus:ring-1 focus:ring-ink-blue transition-colors'"
              required
            >
            <button
              type="button"
              id="togglePassword"
              aria-label="Hiện/ẩn mật khẩu"
              class="absolute inset-y-0 right-0 pr-3 flex items-center text-ink-muted hover:text-ink focus:outline-none"
              onclick="togglePwd()"
            >
              <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
              </svg>
            </button>
          </div>
        </div>

        <!-- Submit Button -->
        <div class="pt-2">
          <button
            type="submit"
            id="loginBtn"
            class="w-full py-2.5 px-4 bg-primary-container hover:bg-primary text-on-primary text-[14px] font-medium rounded-[4px] transition-colors focus:outline-none focus:ring-2 focus:ring-ink-blue/30"
          >
            Đăng nhập
          </button>
        </div>

      </form>

    </div>

    <!-- Footer -->
    <footer class="mt-6 text-center text-[12px] text-ink-muted font-mono opacity-70">
      Hệ thống thư viện nội bộ · v1.1
    </footer>

  </main>

  <script>
    function togglePwd() {
      const pwd = document.getElementById('password');
      const icon = document.getElementById('eyeIcon');
      if (pwd.type === 'password') {
        pwd.type = 'text';
        icon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>`;
      } else {
        pwd.type = 'password';
        icon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />`;
      }
    }
  </script>
</body>
</html>
