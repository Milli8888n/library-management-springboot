<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>500 — Lỗi máy chủ</title>
</head>
<body>

<th:block layout:fragment="breadcrumb">
    <span class="font-label-helper text-label-helper text-ink-muted">Lỗi 500</span>
</th:block>

<th:block layout:fragment="content">
<div class="flex flex-col w-full items-center justify-center">
    <div class="w-full max-w-[480px] bg-paper border border-rule rounded-lg p-8 text-center">
        <span class="inline-block font-mono-code text-[13px] leading-5 font-medium border border-oxblood-border text-oxblood-text bg-oxblood-bg px-2 py-0.5 rounded mb-6">
            Mã lỗi 500
        </span>
        <h1 class="font-headline-h1-mobile text-[24px] leading-8 font-semibold text-ink mb-3">
            Đã xảy ra lỗi hệ thống.
        </h1>
        <p class="font-body-default text-[14px] leading-relaxed text-ink-muted mb-4"
           th:text="${errorMessage}">
            Đã xảy ra lỗi hệ thống. Vui lòng thử lại sau.
        </p>
        <p th:if="${errorId != null}" class="font-mono-code text-[12px] text-ink-muted mb-8">
            Mã tham chiếu: <span class="select-all font-semibold text-oxblood-text" th:text="${errorId}">ERR-12345678</span>
        </p>
        <div th:unless="${errorId != null}" class="mb-8"></div>
        <div class="flex justify-center gap-3 items-center">
            <button class="bg-primary-container text-on-primary font-label-button text-label-button font-medium h-10 px-6 rounded hover:opacity-95 transition-opacity focus:outline-none focus:ring-2 focus:ring-primary-container focus:ring-offset-2 focus:ring-offset-paper"
                    onclick="window.location.reload()"
                    type="button">
                Tải lại trang
            </button>
            <a th:href="@{/books}"
               class="font-label-button text-label-button font-medium text-primary-container bg-transparent h-10 px-4 flex items-center justify-center rounded hover:underline focus:outline-none focus:ring-1 focus:ring-rule-strong">
                Về danh sách sách
            </a>
        </div>
    </div>
    <p class="font-mono-code text-[12px] leading-4 text-ink-muted mt-8 text-center tracking-normal">
        Hệ thống thư viện nội bộ · v1.1
    </p>
</div>
</th:block>
</body>
</html>
