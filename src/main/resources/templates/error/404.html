<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>404 — Không tìm thấy</title>
</head>
<body>

<th:block layout:fragment="breadcrumb">
    <span class="font-label-helper text-label-helper text-ink-muted">Lỗi 404</span>
</th:block>

<th:block layout:fragment="content">
<div class="w-full max-w-[560px] mx-auto px-6 py-16 flex flex-col items-center text-center">
    <div class="font-headline-h1 text-[88px] leading-none font-bold text-primary-container tracking-tight mb-2 select-none">
        404
    </div>
    <h1 class="font-headline-h1-mobile text-[24px] font-semibold text-ink leading-tight mb-3">
        Không tìm thấy trang
    </h1>
    <p class="font-body-default text-[15px] text-ink-muted leading-relaxed max-w-md mb-8">
        Trang bạn đang tìm kiếm không tồn tại hoặc đã được di chuyển.
    </p>
    <a th:href="@{/books}"
       class="inline-flex items-center justify-center bg-primary-container text-on-primary font-label-button font-medium text-label-button px-5 py-2.5 rounded hover:opacity-95 transition-opacity shadow-sm">
        Về danh sách sách
    </a>
</div>
</th:block>
</body>
</html>
