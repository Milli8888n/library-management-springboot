<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Sửa thể loại</title>
</head>
<body>

<th:block layout:fragment="breadcrumb">
    <a th:href="@{/categories}" class="font-label-helper text-label-helper text-ink-muted hover:text-ink">Thể loại</a>
    <span class="text-ink-faint text-[11px]">/</span>
    <span class="font-label-helper text-label-helper text-ink font-medium">Sửa thể loại</span>
</th:block>

<th:block layout:fragment="content">
<div class="flex flex-col w-full">
    <!-- Breadcrumb & Header -->
    <div class="flex flex-col mb-space-xl">
        <nav class="flex items-center gap-1.5 font-label-helper text-label-helper text-ink-muted select-none">
            <a th:href="@{/categories}" class="hover:text-ink transition-colors">Danh m&#x1ee5;c</a>
            <span class="text-ink-faint">/</span>
            <a th:href="@{/categories}" class="hover:text-ink transition-colors">Th&#x1ec3; lo&#x1ea1;i</a>
            <span class="text-ink-faint">/</span>
            <span class="text-ink font-medium">S&#x1eeda;</span>
        </nav>
        <div class="flex flex-col sm:flex-row sm:items-baseline justify-between gap-space-sm mt-space-xs">
            <div class="flex flex-col">
                <h1 class="font-headline-h1 text-headline-h1 text-ink tracking-tight">Sửa thể loại</h1>
                <div class="flex items-center gap-space-sm mt-space-xs font-body-table-cell text-body-table-cell text-ink-muted">
                    <span class="font-mono-code text-mono-code text-ink" th:text="'Mã #' + ${categoryId}">Mã #1</span>
                    <span class="text-ink-faint select-none">·</span>
                    <span th:if="${category != null && category.active}"
                          class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-[2px] bg-moss-bg border border-moss-border text-moss-text font-label-badge text-label-badge">
                        <span class="w-1.5 h-1.5 rounded-full bg-moss-text"></span>
                        Hoạt động
                    </span>
                    <span th:if="${category != null && !category.active}"
                          class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-[2px] bg-slate-bg border border-slate-border text-slate-text font-label-badge text-label-badge">
                        <span class="w-1.5 h-1.5 rounded-full bg-slate-text"></span>
                        Ngừng
                    </span>
                    <span class="text-ink-faint select-none">·</span>
                    <span th:text="${(category != null && category.books != null ? #lists.size(category.books) : 0) + ' sách'}">0 sách</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Form Container -->
    <div class="w-full max-w-[640px] bg-paper border border-rule rounded-xl p-[28px]">
        <form th:action="@{/categories/{id}/edit(id=${categoryId})}"
              th:object="${categoryForm}"
              method="post"
              id="edit-category-form"
              class="flex flex-col gap-space-xl">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <!-- Name Field -->
            <div class="flex flex-col gap-space-xs">
                <label class="font-label-field text-label-field text-ink" for="category-name">
                    Tên thể loại <span class="text-error">*</span>
                </label>
                <div class="relative">
                    <input th:field="*{name}"
                           id="category-name"
                           type="text"
                           maxlength="100"
                           required
                           class="w-full h-10 px-3 bg-paper border border-rule-strong rounded-lg font-body-default text-body-default text-ink placeholder-ink-faint focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-colors"/>
                </div>
                <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="text-error font-label-helper text-[12px] mt-0.5"></p>
                <div class="flex items-center justify-between font-label-helper text-label-helper text-ink-muted mt-space-xs">
                    <span>Tối đa 100 ký tự. Không phân biệt chữ hoa, chữ thường.</span>
                    <span class="font-mono-code text-mono-code text-ink-muted shrink-0 ml-space-sm" id="name-counter">0 / 100</span>
                </div>
            </div>

            <!-- Description Field -->
            <div class="flex flex-col gap-space-xs">
                <label class="font-label-field text-label-field text-ink" for="category-description">
                    Mô tả
                </label>
                <div class="relative">
                    <textarea th:field="*{description}"
                              id="category-description"
                              rows="4"
                              maxlength="500"
                              class="w-full min-h-[96px] p-3 bg-paper border border-rule-strong rounded-lg font-body-default text-body-default text-ink placeholder-ink-faint focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-colors resize-y"></textarea>
                </div>
                <p th:if="${#fields.hasErrors('description')}" th:errors="*{description}" class="text-error font-label-helper text-[12px] mt-0.5"></p>
                <div class="flex items-center justify-end font-label-helper text-label-helper text-ink-muted mt-space-xs">
                    <span class="font-mono-code text-mono-code text-ink-muted" id="description-counter">0 / 500</span>
                </div>
            </div>

            <!-- Status Checkbox -->
            <div class="flex items-center gap-2">
                <input type="checkbox"
                       th:field="*{active}"
                       id="category-active"
                       class="rounded border-rule-strong text-primary-container focus:ring-primary-container h-4 w-4"/>
                <label for="category-active" class="font-label-field text-label-field text-ink select-none cursor-pointer">
                    Đang hoạt động
                </label>
            </div>

            <!-- Submit Buttons -->
            <div class="pt-space-xl border-t border-rule mt-space-sm flex items-center gap-space-md">
                <button type="submit"
                        id="btn-submit"
                        class="h-10 px-space-xl bg-primary-container hover:opacity-95 active:opacity-90 text-white font-label-button text-label-button rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-container focus:ring-offset-2 focus:ring-offset-paper transition-all select-none shadow-none">
                    Lưu
                </button>
                <a th:href="@{/categories}"
                   class="inline-flex items-center justify-center h-10 px-5 bg-paper border border-rule-strong text-ink font-label-button text-label-button rounded-lg hover:bg-slate-bg active:bg-linen focus:outline-none transition-colors select-none">
                    Hủy
                </a>
            </div>
        </form>
    </div>
</div>

<script>
  (function() {
    const nameInput = document.getElementById('category-name');
    const descTextarea = document.getElementById('category-description');
    const nameCounter = document.getElementById('name-counter');
    const descCounter = document.getElementById('description-counter');

    function updateCounter(element, counterElement, max) {
      if (!element || !counterElement) return;
      counterElement.textContent = element.value.length + ' / ' + max;
    }

    if (nameInput && nameCounter) {
      updateCounter(nameInput, nameCounter, 100);
      nameInput.addEventListener('input', () => updateCounter(nameInput, nameCounter, 100));
    }

    if (descTextarea && descCounter) {
      updateCounter(descTextarea, descCounter, 500);
      descTextarea.addEventListener('input', () => updateCounter(descTextarea, descCounter, 500));
    }
  })();
</script>
</th:block>
</body>
</html>
