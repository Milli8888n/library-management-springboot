<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Thêm sách</title>
</head>
<body>

<th:block layout:fragment="breadcrumb">
    <a th:href="@{/books}" class="font-label-helper text-label-helper text-ink-muted hover:text-ink">Sách</a>
    <span class="text-ink-faint text-[11px]">/</span>
    <span class="font-label-helper text-label-helper text-ink font-medium">Thêm mới</span>
</th:block>

<th:block layout:fragment="content">
<div class="flex flex-col w-full">
    <!-- Breadcrumb & Page Header -->
    <div class="flex flex-col mb-6">
        <nav aria-label="Đường dẫn trang" class="flex items-center gap-1.5 font-label-helper text-label-helper text-ink-muted mb-1.5 select-none">
            <span>Danh mục</span>
            <span class="text-ink-faint">/</span>
            <a th:href="@{/books}" class="hover:text-ink transition-colors">Sách</a>
            <span class="text-ink-faint">/</span>
            <span class="text-ink font-medium">Thêm mới</span>
        </nav>
        <div class="flex items-baseline justify-between">
            <div>
                <h1 class="font-headline-h1 text-headline-h1 text-ink tracking-tight">Thêm sách</h1>
                <p class="font-body-default text-body-default text-ink-muted mt-0.5">Nhập thông tin thư mục và khởi tạo số lượng ấn bản trong kho lưu trữ.</p>
            </div>
        </div>
    </div>

    <!-- Main Content: FormPanel -->
    <div class="bg-paper border border-rule rounded-xl p-6 max-w-[760px]">
        <form th:action="@{/books/create}" th:object="${bookForm}" method="post"
              id="addBookForm" class="space-y-5">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <!-- Row 1: ISBN & Trạng thái -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                <div class="flex flex-col">
                    <label class="font-label-field text-label-field text-ink mb-1.5 flex items-center" for="isbn">
                        <span>ISBN</span>
                        <span class="text-oxblood-text ml-0.5">*</span>
                    </label>
                    <input th:field="*{isbn}"
                           id="isbn"
                           type="text"
                           required
                           placeholder="Ví dụ: 9780132350884"
                           class="h-10 px-3 bg-paper border border-rule-strong rounded text-ink font-mono-code text-mono-code placeholder:text-ink-faint focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-colors"/>
                    <p th:if="${#fields.hasErrors('isbn')}" th:errors="*{isbn}" class="text-error font-label-helper text-[12px] mt-1"></p>
                    <span class="font-label-helper text-label-helper text-ink-muted mt-1.5">ISBN-10 hoặc ISBN-13, có thể dùng dấu gạch nối</span>
                </div>
                <div class="flex flex-col">
                    <label class="font-label-field text-label-field text-ink mb-1.5" for="status">
                        <span>Trạng thái</span>
                    </label>
                    <div class="relative">
                        <select th:field="*{status}"
                                id="status"
                                class="w-full h-10 px-3 pr-9 bg-paper border border-rule-strong rounded text-ink font-body-default text-body-default appearance-none focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-colors cursor-pointer">
                            <option th:each="st : ${statuses}"
                                    th:value="${st.name()}"
                                    th:text="${st.displayName}">Đang hoạt động</option>
                        </select>
                        <div class="absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none text-ink-muted flex items-center">
                            <span class="material-symbols-outlined text-[18px]">expand_more</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Row 2: Tên sách (Full width) -->
            <div class="flex flex-col">
                <label class="font-label-field text-label-field text-ink mb-1.5 flex items-center" for="title">
                    <span>Tên sách</span>
                    <span class="text-oxblood-text ml-0.5">*</span>
                </label>
                <input th:field="*{title}"
                       id="title"
                       type="text"
                       required
                       placeholder="Nhập tên đầu sách..."
                       class="h-10 px-3 bg-paper border border-rule-strong rounded text-ink font-body-default text-body-default placeholder:text-ink-faint focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-colors"/>
                <p th:if="${#fields.hasErrors('title')}" th:errors="*{title}" class="text-error font-label-helper text-[12px] mt-1"></p>
            </div>

            <!-- Row 3: Tác giả & Thể loại -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                <div class="flex flex-col">
                    <label class="font-label-field text-label-field text-ink mb-1.5 flex items-center" for="author">
                        <span>Tác giả</span>
                        <span class="text-oxblood-text ml-0.5">*</span>
                    </label>
                    <input th:field="*{author}"
                           id="author"
                           type="text"
                           required
                           placeholder="Ví dụ: Robert C. Martin"
                           class="h-10 px-3 bg-paper border border-rule-strong rounded text-ink font-body-default text-body-default placeholder:text-ink-faint focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-colors"/>
                    <p th:if="${#fields.hasErrors('author')}" th:errors="*{author}" class="text-error font-label-helper text-[12px] mt-1"></p>
                </div>
                <div class="flex flex-col">
                    <label class="font-label-field text-label-field text-ink mb-1.5 flex items-center" for="categoryId">
                        <span>Thể loại</span>
                        <span class="text-oxblood-text ml-0.5">*</span>
                    </label>
                    <div class="relative">
                        <select th:field="*{categoryId}"
                                id="categoryId"
                                required
                                class="w-full h-10 px-3 pr-9 bg-paper border border-rule-strong rounded text-ink font-body-default text-body-default appearance-none focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-colors cursor-pointer">
                            <option value="">Chọn thể loại</option>
                            <option th:each="cat : ${categories}"
                                    th:value="${cat.id}"
                                    th:text="${cat.name}">Công nghệ thông tin</option>
                        </select>
                        <div class="absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none text-ink-muted flex items-center">
                            <span class="material-symbols-outlined text-[18px]">expand_more</span>
                        </div>
                    </div>
                    <p th:if="${#fields.hasErrors('categoryId')}" th:errors="*{categoryId}" class="text-error font-label-helper text-[12px] mt-1"></p>
                </div>
            </div>

            <!-- Row 4: Tổng số lượng & Số lượng đang có -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                <div class="flex flex-col">
                    <label class="font-label-field text-label-field text-ink mb-1.5 flex items-center" for="totalQuantity">
                        <span>Tổng số lượng</span>
                        <span class="text-oxblood-text ml-0.5">*</span>
                    </label>
                    <input th:field="*{totalQuantity}"
                           id="totalQuantity"
                           type="number"
                           min="1"
                           required
                           class="h-10 px-3 bg-paper border border-rule-strong rounded text-ink font-mono-code text-mono-code focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-colors"/>
                    <p th:if="${#fields.hasErrors('totalQuantity')}" th:errors="*{totalQuantity}" class="text-error font-label-helper text-[12px] mt-1"></p>
                </div>
                <div class="flex flex-col">
                    <label class="font-label-field text-label-field text-ink mb-1.5" for="availableQuantity">
                        <span>Số lượng đang có</span>
                    </label>
                    <input th:field="*{availableQuantity}"
                           id="availableQuantity"
                           type="number"
                           min="0"
                           placeholder="Để trống nếu bằng tổng"
                           class="h-10 px-3 bg-paper border border-rule-strong rounded text-ink font-mono-code text-mono-code placeholder:text-ink-faint focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-colors"/>
                    <span class="font-label-helper text-label-helper text-ink-muted mt-1.5">Để trống nếu bằng tổng số lượng</span>
                    <p th:if="${#fields.hasErrors('availableQuantity')}" th:errors="*{availableQuantity}" class="text-error font-label-helper text-[12px] mt-1"></p>
                </div>
            </div>

            <!-- Divider -->
            <div class="border-t border-rule my-6"></div>

            <!-- Actions -->
            <div class="flex items-center gap-3 pt-1">
                <button type="submit"
                        class="h-10 px-5 bg-primary-container text-on-primary rounded font-label-button text-label-button hover:bg-primary transition-colors focus:outline-none focus:ring-2 focus:ring-primary-container focus:ring-offset-2 focus:ring-offset-paper cursor-pointer select-none">
                    Lưu
                </button>
                <a th:href="@{/books}"
                   class="h-10 px-5 bg-paper border border-rule-strong text-ink rounded font-label-button text-label-button hover:bg-slate-bg transition-colors focus:outline-none inline-flex items-center select-none">
                    Hủy
                </a>
            </div>
        </form>
    </div>
</div>
</th:block>
</body>
</html>
