<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Sửa thành viên</title>
</head>
<body>

<th:block layout:fragment="breadcrumb">
    <a th:href="@{/members}" class="font-label-helper text-label-helper text-ink-muted hover:text-ink">Thành viên</a>
    <span class="text-ink-faint text-[11px]">/</span>
    <span class="font-label-helper text-label-helper text-ink font-medium">Sửa thành viên</span>
</th:block>

<th:block layout:fragment="content">
<div class="flex flex-col w-full max-w-[640px]">
    <!-- Breadcrumb & Header Title -->
    <div class="flex flex-col gap-space-sm mb-space-xl">
        <nav class="flex items-center gap-1.5 font-label-helper text-label-helper text-ink-muted select-none">
            <span>Danh mục</span>
            <span class="text-ink-faint">/</span>
            <a th:href="@{/members}" class="hover:text-ink transition-colors">Thành viên</a>
            <span class="text-ink-faint">/</span>
            <span class="text-ink font-medium">Sửa</span>
        </nav>
        <div class="flex items-baseline justify-between gap-space-lg flex-wrap">
            <div class="flex flex-col gap-space-xs">
                <h1 class="font-headline-h1 text-headline-h1 text-ink tracking-tight">Sửa thành viên</h1>
                <div class="font-mono-code text-mono-code text-ink-muted">
                    <span th:text="'Mã #' + ${memberId}">Mã #1</span>
                    <span class="mx-space-xs text-rule-strong">·</span>
                    <span th:if="${member != null}" th:text="'Tạo ngày ' + ${#temporals.format(member.createdAt, 'dd/MM/yyyy')}">Tạo ngày 01/01/2026</span>
                </div>
            </div>
            <div th:if="${member != null}">
                <span th:if="${member.status?.name() == 'ACTIVE'}"
                      class="inline-flex items-center gap-1.5 h-[22px] px-2 rounded-[2px] bg-moss-bg border border-moss-border text-moss-text select-none self-start sm:self-center">
                    <span class="w-1.5 h-1.5 rounded-full bg-moss-text"></span>
                    <span class="font-label-badge text-label-badge font-medium">Đang hoạt động</span>
                </span>
                <span th:if="${member.status?.name() == 'BLOCKED'}"
                      class="inline-flex items-center gap-1.5 h-[22px] px-2 rounded-[2px] bg-oxblood-bg border border-oxblood-border text-oxblood-text select-none self-start sm:self-center">
                    <span class="w-1.5 h-1.5 rounded-full bg-oxblood-text"></span>
                    <span class="font-label-badge text-label-badge font-medium">Bị khóa</span>
                </span>
            </div>
        </div>
    </div>

    <!-- Form Panel Card -->
    <div class="w-full bg-paper border border-rule rounded-xl p-space-xl shadow-none">
        <form th:action="@{/members/{id}/edit(id=${memberId})}"
              th:object="${memberForm}"
              method="post"
              id="edit-member-form"
              class="flex flex-col gap-space-lg">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <!-- Họ tên -->
            <div class="flex flex-col gap-1.5">
                <label class="font-label-field text-label-field text-ink" for="member-fullname">
                    Họ tên <span class="text-oxblood-text font-normal">*</span>
                </label>
                <input th:field="*{fullName}"
                       id="member-fullname"
                       type="text"
                       required
                       maxlength="100"
                       class="h-10 px-3 bg-paper border border-rule-strong rounded-DEFAULT font-body-default text-body-default text-ink focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-colors"/>
                <p th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}" class="text-error font-label-helper text-[12px] mt-0.5"></p>
            </div>

            <!-- Email -->
            <div class="flex flex-col gap-1.5">
                <label class="font-label-field text-label-field text-ink" for="member-email">
                    Email <span class="text-oxblood-text font-normal">*</span>
                </label>
                <input th:field="*{email}"
                       id="member-email"
                       type="email"
                       required
                       maxlength="150"
                       class="h-10 px-3 bg-paper border border-rule-strong rounded-DEFAULT font-body-default text-body-default text-ink focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-colors"/>
                <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="text-error font-label-helper text-[12px] mt-0.5"></p>
            </div>

            <!-- Điện thoại -->
            <div class="flex flex-col gap-1.5">
                <label class="font-label-field text-label-field text-ink" for="member-phone">
                    Điện thoại
                </label>
                <input th:field="*{phone}"
                       id="member-phone"
                       type="tel"
                       maxlength="15"
                       class="h-10 px-3 bg-paper border border-rule-strong rounded-DEFAULT font-body-default text-body-default text-ink focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-colors"/>
                <p th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}" class="text-error font-label-helper text-[12px] mt-0.5"></p>
                <span class="font-label-helper text-label-helper text-ink-muted">
                    10 chữ số bắt đầu bằng 0
                </span>
            </div>

            <!-- Trạng thái (READ-ONLY info) -->
            <div class="flex flex-col gap-1.5">
                <span class="font-label-field text-label-field text-ink">Trạng thái</span>
                <div class="h-10 px-3 bg-linen rounded-DEFAULT flex items-center justify-between border border-slate-border select-none">
                    <div th:if="${memberForm.status?.name() == 'ACTIVE'}"
                         class="inline-flex items-center gap-1.5 h-[22px] px-2 rounded-[2px] bg-moss-bg border border-moss-border text-moss-text">
                        <span class="w-1.5 h-1.5 rounded-full bg-moss-text"></span>
                        <span class="font-label-badge text-label-badge font-medium">Đang hoạt động</span>
                    </div>
                    <div th:if="${memberForm.status?.name() == 'BLOCKED'}"
                         class="inline-flex items-center gap-1.5 h-[22px] px-2 rounded-[2px] bg-oxblood-bg border border-oxblood-border text-oxblood-text">
                        <span class="w-1.5 h-1.5 rounded-full bg-oxblood-text"></span>
                        <span class="font-label-badge text-label-badge font-medium">Bị khóa</span>
                    </div>
                    <span class="material-symbols-outlined text-[18px] text-ink-faint">lock</span>
                </div>
                <span class="font-label-helper text-label-helper text-ink-muted">
                    Khóa hoặc mở khóa tại danh sách thành viên.
                </span>
            </div>

            <!-- Divider -->
            <div class="w-full h-[1px] bg-rule my-space-xs"></div>

            <!-- Actions -->
            <div class="flex items-center gap-space-md pt-space-xs">
                <button type="submit"
                        id="submit-btn"
                        class="h-10 px-space-lg bg-primary-container hover:bg-primary text-white rounded-DEFAULT font-label-button text-label-button font-medium cursor-pointer transition-colors shadow-none focus:outline-none focus:ring-2 focus:ring-primary-container focus:ring-offset-2 focus:ring-offset-paper">
                    Lưu
                </button>
                <a th:href="@{/members}"
                   class="inline-flex items-center justify-center h-10 px-space-lg bg-paper border border-rule-strong hover:bg-row-hover text-ink rounded-DEFAULT font-label-button text-label-button font-medium transition-colors no-underline cursor-pointer">
                    Hủy
                </a>
            </div>
        </form>
    </div>
</div>
</th:block>
</body>
</html>
